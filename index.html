<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor Adaptativo - Acessibilidade na Leitura</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0052a3;
    }
    #resultado {
      margin-top: 30px;
      padding: 20px;
      background-color: #f9f9f9;
      border-left: 4px solid #0066cc;
      font-size: 18px;
      white-space: pre-wrap; 
    }
  </style>
</head>
<body>

  <h1>Leitor Adaptativo para Facilitar a Leitura</h1>
  <p>Cole seu texto abaixo para gerar a versão com destaque inicial nas palavras:</p>

  <textarea id="textoEntrada" placeholder="Cole o texto aqui..."></textarea>
  <br>
  <button onclick="converterTexto()">Converter Texto</button>

  <h2>Resultado:</h2>
  <div id="resultado">O texto convertido aparecerá aqui...</div>

  <script>
    function converterTexto() {
      
      const textoOriginal = document.getElementById('textoEntrada').value;
      
      if (!textoOriginal.trim()) {
        document.getElementById('resultado').innerHTML = "Por favor, insira um texto.";
        return;
      }

      
      const palavras = textoOriginal.split(' ');

    
      const palavrasFormatadas = palavras.map(palavra => {
        if (palavra.length === 0) return '';

     
        const tamanhoNegrito = Math.ceil(palavra.length / 2);

        
        const parteNegrito = palavra.slice(0, tamanhoNegrito);
        const parteNormal = palavra.slice(tamanhoNegrito);

       
        return `<b>${parteNegrito}</b>${parteNormal}`;
      });

      document.getElementById('resultado').innerHTML = palavrasFormatadas.join(' ');
    }
  </script>

</body>
</html>
